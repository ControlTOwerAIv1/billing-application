[project]
name = "orderbot-supply-chain"
version = "0.1.0"
description = "OrderBot - AI-first Supply Chain & Wholesale Distribution Assistant"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "Django>=6.0,<7",
    "django-ninja>=1.6",
    "langchain-anthropic>=1.5.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "litellm>=1.50",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
]

[tool.uv]
package = false
